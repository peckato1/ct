name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck -x -s bash ct ct.bash-completion test.sh build-deb.sh build-apt-repo.sh

      - name: Tests
        run: ./test.sh

      - name: Build package
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            ./build-deb.sh "$GITHUB_REF_NAME"
          else
            ./build-deb.sh "0~git${GITHUB_SHA::7}"
          fi

      # Every run keeps its .deb as a downloadable artifact (zipped, kept for 90 days).
      - uses: actions/upload-artifact@v7
        with:
          name: ct-deb
          path: dist/ct_*_all.deb
          if-no-files-found: error

      # Also attached as ct_all.deb, so releases/latest/download/ct_all.deb always points to the newest one.
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/ct_*_all.deb dist/ct_all.deb
          gh release create "$GITHUB_REF_NAME" dist/*.deb --title "$GITHUB_REF_NAME" --generate-notes
          gh workflow run apt-repo.yml --ref main
